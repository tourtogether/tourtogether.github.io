<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#176b50"><meta name="description" content="성수동의 여행과 일상이 함께하는 지도. 주거와 상권, 생활 편의시설, 주민을 배려하는 보행 길찾기.">
 <title>성공지도 — TOUR:TOGETHER</title>
 <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
 <link rel="stylesheet" href="./vendor/leaflet/leaflet.css"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/features.css">
 <script src="./vendor/leaflet/leaflet.js" defer></script><script type="module" src="./js/app.js"></script>
</head>
<body>
 <a class="skip-link" href="#search">장소 검색으로 이동 / Skip to search</a>
 <nav class="rail" aria-label="Main navigation">
  <a class="rail-brand" href="./" aria-label="TOUR:TOGETHER"><img src="./assets/logo.svg" alt="" width="40" height="40"></a>
  <button class="rail-item active" data-nav="map"><span data-icon="map"></span><span data-i18n="map">지도</span></button>
  <button class="rail-item" data-nav="facilities"><span data-icon="toilet"></span><span data-i18n="facilities">편의시설</span></button>
  <button id="route-open" class="rail-item" data-nav="routes"><span data-icon="route"></span><span data-i18n="routeOpen">보행 길찾기</span></button>
  <button class="rail-item" data-nav="etiquette"><span data-icon="leaf"></span><span data-i18n="etiquette">방문 에티켓</span></button>
  <button id="issues-open" class="rail-item" data-nav="issues"><span data-icon="home"></span><span data-i18n="residentIssues">생활권 안내</span></button>
  <button id="population-open" class="rail-item" data-nav="population"><span data-icon="people"></span><span data-i18n="populationOpen">유동인구·혼잡도</span></button>
  <button class="rail-item" data-nav="saved"><span data-icon="bookmark"></span><span data-i18n="savedPlaces">저장한 장소</span></button>
  <button id="editor-open" class="rail-item" data-nav="edit"><span data-icon="edit"></span><span data-i18n="teamEditor">팀 편집</span></button>
  <button id="coverage-open" class="rail-item" data-nav="coverage"><span data-icon="layers"></span><span data-i18n="dataCoverage">구역 근거</span></button>
  <button class="rail-item rail-about" data-nav="about"><span data-icon="info"></span><span data-i18n="about">프로젝트 소개</span></button>
  <span class="rail-signature">투투</span>
 </nav>
 <aside class="sidebar" aria-label="Places">
  <header class="brand-header"><div><span class="wordmark">TOUR:TOGETHER</span><h1 data-i18n="brand">성공지도</h1></div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option></select></header>
  <div class="search-wrap"><span data-icon="search"></span><input id="search" name="place-search" type="search" autocomplete="off" data-placeholder="search" placeholder="장소 또는 시설 검색" aria-label="장소 또는 시설 검색"></div>
  <div class="filters" aria-label="Place categories"><button class="chip selected" data-category="all" data-i18n="all">전체</button><button class="chip" data-category="restaurant"><span data-icon="restaurant"></span><span data-i18n="restaurant">로컬 맛집</span></button><button class="chip" data-category="toilet"><span data-icon="toilet"></span><span data-i18n="toilet">화장실</span></button><button class="chip" data-category="bin"><span data-icon="bin"></span><span data-i18n="bin">쓰레기통</span></button><button class="chip" data-category="smoking"><span data-icon="smoking"></span><span data-i18n="smoking">흡연시설</span></button></div>
  <div class="workspace-filters"><button class="chip" data-category="selected" data-i18n="teamSelected">팀이 선정한 장소</button><button id="bin-directory-open" class="text-button" data-i18n="binDirectory">쓰레기통 주소 목록</button></div>
  <div class="list-heading"><button id="list-toggle" class="list-title" aria-expanded="true"><h2 data-i18n="nearby">지금 필요한 곳</h2><span id="result-count"></span><span class="mobile-chevron" data-icon="chevron"></span></button><p data-i18n="listNote">자료의 확인 상태와 이용 조건을 확인해 주세요.</p></div>
  <div id="place-list" class="place-list"></div>
  <div id="empty-state" class="empty-state" hidden><span data-icon="search"></span><strong data-i18n="empty"></strong><p data-i18n="emptyHelp"></p></div>
  <footer class="sidebar-footer"><span data-icon="leaf"></span><div><strong data-i18n="smallManners">좋은 방문은 작은 배려에서</strong><p data-i18n="mannersIntro">성수는 여행지이자 누군가의 집이에요.</p></div></footer>
 </aside>
 <main class="map-stage">
  <div id="map" role="region" aria-label="Seongsu map"></div>
  <div class="map-topline"><button id="area-reset" class="area-label"><span data-icon="pin"></span><span>성수 Seongsu</span><span data-icon="chevron"></span></button><span id="demo-badge" class="demo-badge"><span class="demo-dot"></span><span data-i18n="demo">시연용 예시</span></span></div>
  <div class="map-intro"><h2 data-i18n="tagline">여행과 일상이 함께하는 성수</h2><p id="map-intro-note">지도 자료를 확인하고 있어요.</p></div>
  <div class="map-actions"><button id="demo-open" class="demo-trigger" data-i18n-label="tryDemo"><span data-icon="play"></span><span data-i18n="tryDemo">진입 알림 체험</span></button><button id="demo-exit" class="secondary-button" hidden data-i18n="endDemo">시연 종료</button></div>
  <div id="tile-warning" class="map-warning" role="status" hidden data-i18n="tileError"></div>
  <section id="zone-alert" class="zone-alert" role="status" aria-live="polite" hidden><span class="alert-symbol" data-icon="home"></span><div><span class="mini-badge" data-i18n="demo"></span><h2 id="alert-title"></h2><p data-i18n="alertBody"></p><button id="alert-more" class="text-button" data-i18n="more"></button></div><button id="alert-dismiss" class="icon-button" data-i18n-label="understood"><span data-icon="close"></span></button></section>
  <div class="map-tools"><button id="gps-button" class="tool-button" data-i18n-label="location"><span data-icon="locate"></span></button><div class="zoom-tools"><button id="zoom-in" class="tool-button" data-i18n-label="zoomIn">+</button><button id="zoom-out" class="tool-button" data-i18n-label="zoomOut">−</button></div></div>
  <div class="map-legend"><div class="legend-heading" data-i18n="areaLayers">구역 표시</div><div class="legend-items"></div><p id="map-legend-note"></p></div>
  <section id="demo-panel" class="demo-panel" hidden><div class="demo-panel-head"><span class="mini-badge" data-i18n="modeDemo"></span><button id="demo-close" class="icon-button" data-i18n-label="close"><span data-icon="close"></span></button></div><h2 data-i18n="sceneIntro"></h2><p class="demo-caption" data-i18n="sceneNote"></p><div class="scene-progress"><span id="scene-step">1 / 9</span><strong id="scene-label"></strong></div><div class="progress-track"><div id="scene-progress"></div></div><div class="demo-controls"><button id="demo-reset" class="secondary-button" data-i18n="reset"></button><button id="demo-play" class="secondary-button" data-i18n="play"></button><button id="demo-next" class="primary-button" data-i18n="next"></button></div><details class="demo-errors"><summary data-i18n="scenario"></summary><button id="demo-poor" data-i18n="poorGps"></button><button id="demo-denied" data-i18n="permissionDemo"></button></details></section>
  <div id="location-status" class="location-status" role="status" data-i18n="locationIntro"></div>
  <section id="detail-panel" class="detail-panel" aria-labelledby="detail-name" hidden><button id="detail-close" class="icon-button detail-close" data-i18n-label="close"><span data-icon="close"></span></button><div id="detail-content"></div></section>
 </main>
 <dialog id="info-dialog"><div class="dialog-header"><img src="./assets/logo.svg" width="36" height="36" alt=""><button id="dialog-close" class="icon-button" data-i18n-label="close"><span data-icon="close"></span></button></div><div id="dialog-content"></div></dialog>
 <div id="toast" class="toast" role="status" hidden></div>
<script data-goatcounter="https://tourtogether.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
